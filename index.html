<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <!-- meta -->
    <title>Vojtěch Klouda</title>
    <meta name="description" content="Projects, experiments and publications by Vojtěch Klouda.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vojtěch Klouda">
    <meta property="og:description" content="Projects, experiments and publications by Vojtěch Klouda.">
    <meta property="og:url" content="https://vojtechklouda.com/">
    <!-- /meta -->
    <script>
        // Set the theme before first paint to avoid a flash of the wrong colors.
        document.documentElement.dataset.theme = localStorage.getItem('theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Visitor stats: https://vojtechklouda.goatcounter.com (no cookies, localhost is not counted) -->
    <script data-goatcounter="https://vojtechklouda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
    <canvas id="webgl-background"></canvas>
    <nav id="nav_menu">
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
    </nav>
    <main class="content">
        <section id="home" class="section">
            <h1>Welcome</h1>
            <p>Try playing with the background!</p>
            <p class="hint-mouse">Left click to <b>attract</b>, right click to <b>repel</b>.</p>
            <p class="hint-touch">Hold to <b>attract</b>, double-tap to <b>repel</b>.</p>
        </section>
        <section id="about" class="section">
            <h1>About me</h1>
            <div id="cv"></div>
        </section>
        <section id="projects" class="section">
            <h1>Projects</h1>
            <div id="tiles" class="tiles"></div>
        </section>
        <article id="post" class="section"></article>
    </main>

    <script src="site.js"></script>
    <script src="background.js"></script>
</body>
</html>
